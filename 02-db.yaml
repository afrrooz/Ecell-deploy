---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ecell-db-pvc
  namespace: ecell
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecell-db
  namespace: ecell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecell-db
  template:
    metadata:
      labels:
        app: ecell-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: ecell-db-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ecell_user", "-d", "ecell_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: ecell-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ecell-db-service
  namespace: ecell
spec:
  selector:
    app: ecell-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
