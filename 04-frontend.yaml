---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecell-frontend
  namespace: ecell
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecell-frontend
  template:
    metadata:
      labels:
        app: ecell-frontend
    spec:
      containers:
        - name: ecell-frontend
          image: devshaik010/ecell-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
          env:
            - name: VITE_BACKEND_URL
              value: "http://ecell-backend-service:5000"
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ecell-frontend-service
  namespace: ecell
spec:
  selector:
    app: ecell-frontend
  type: NodePort
  ports:
    - port: 80
      targetPort: 5173
      nodePort: 30000
