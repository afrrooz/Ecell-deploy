---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecell-backend
  namespace: ecell
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecell-backend
  template:
    metadata:
      labels:
        app: ecell-backend
    spec:
      containers:
        - name: ecell-backend
          image: devshaik010/ecell-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecell-db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ecell-backend-service
  namespace: ecell
spec:
  selector:
    app: ecell-backend
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001
